name: 同步作者点评

on:
  issues:
    types: [opened, edited, closed, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: author-reviews-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'Rakka-r1a/XATUer_select_food' && (github.event_name == 'workflow_dispatch' || (github.event.issue.user.id == 196425000))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: read
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 核验作者并生成公开点评
        run: node scripts/sync-author-reviews.cjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: 保存点评资料
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/author-reviews.json
          git diff --cached --quiet && exit 0
          git commit -m 'docs: sync verified author reviews'
          git push origin HEAD:main
      - name: 发布最新点评
        run: node scripts/sync-author-reviews.cjs --request-build
        env:
          GITHUB_TOKEN: ${{ github.token }}
